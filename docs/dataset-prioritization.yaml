# Dataset Prioritization Framework
#
# 각 데이터셋을 4가지 기준으로 1~5점 평가하여 우선순위를 결정한다.
# 총점(합산, 4~20) 기준으로 Top 50을 production-grade spec으로 전환한다.
# 합산을 사용하는 이유: 곱셈 모델은 단일 기준 1점이 전체를 0에 가깝게 만들어
# 불균형하게 작용한다. 합산은 해석이 직관적이고 기준 간 가중치 조정이 용이하다.
#
# 기준:
#   Demand    - 실제 앱/분석/AI에서 자주 쓰이는가 (1=드묾, 5=매우 빈번)
#   Pain      - 원 API 사용성이 나쁜가, KPubData 부가가치 (1=쉬움, 5=매우 어려움)
#   Openness  - 상업적 이용·재배포 조건 (1=제한적, 5=자유이용)
#   Stability - API 안정성·지속적 관리 여부 (1=불안정, 5=매우 안정)
#
# status:
#   spec      - spec 기반 검증 완료
#   catalogue - catalogue 등록만 됨
#   planned   - 미등록, 추가 예정

