# 목적: GitHub hosted runner(Azure 해외 IP)에서 한국 공공 API 게이트웨이의 네트워크 도달성을
# 검증한다. API 키가 없어도 게이트웨이가 HTTP 응답(에러 본문 포함)을 반환하면 IP 차단은
# 없는 것으로 판정한다(애플리케이션 계열 인증 에러는 정상). 실증 기록: 이슈 #383
name: Geo Check (Korean public API reachability from hosted runner)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/geo-check.yml"

permissions:
  contents: read

jobs:
  geo-check:
    name: Reachability probe (no key, 3 retries per endpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show outbound IP
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org || curl -s --max-time 10 https://ifconfig.me || echo unknown)
          echo "outbound_ip=$ip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe endpoints
        run: |
          set -uo pipefail
          probe() {
            local name="$1" url="$2" attempt code err
            for attempt in 1 2 3; do
              err=$(mktemp)
              code=$(curl -sS -o /tmp/probe_body.txt -w '%{http_code}' --max-time 15 "$url" 2>"$err" || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "$name|attempt=$attempt|http=$code|$(head -c 120 /tmp/probe_body.txt | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              echo "$name|attempt=$attempt|FAIL|curl: $(tail -c 160 "$err" | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
              sleep 5
            done
            return 1
          }
          verdict=ok
          probe "data.go.kr(apis,https)" "https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty?sidoName=%EC%84%9C%EC%9A%B8&returnType=json" || verdict=blocked
          probe "data.go.kr(apis,http)" "http://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty?sidoName=%EC%84%9C%EC%9A%B8&returnType=json" || true
          probe "kosis.kr" "https://kosis.kr/openapi/OW8I94IT29/A/json/0/1" || verdict=blocked
          probe "sgis(kostat)" "https://sgisapi.kostat.go.kr/OpenAPI3/auth/authentication.json" || true
          probe "data.seoul.go.kr" "https://data.seoul.go.kr/" || true
          if [ "$verdict" = "blocked" ]; then
            echo "::error::data.go.kr or kosis unreachable from hosted runner (see summary) — Phase 5 needs self-hosted KR runner"
            exit 1
          fi
          echo "::notice::core gateways reachable from hosted runner"
