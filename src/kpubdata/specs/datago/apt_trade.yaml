# 골든 예제: 필수 필터 파라미터를 포함하는 데이터셋
# 카테고리: 페이지네이션 예제
# 참고: 이 spec은 필수 필터(LAWD_CD, DEAL_YMD)를 요구하는 부동산 실거래가 데이터셋입니다.

id: datago.apt_trade
provider: datago
title: 아파트매매 실거래가
description: 국토교통부에서 제공하는 아파트 매매 실거래 데이터입니다. 지역코드와 거래연월을 필수 조건으로 조회합니다.

source:
  url: https://www.data.go.kr
  verified_at: "2026-04-21"

endpoint:
  base_url: http://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev
  operation: getRTMSDataSvcAptTradeDev
  method: GET
  format_param:
    name: resultType
    values:
      json: json
      xml: xml

auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago

params:
  - name: LAWD_CD
    type: string
    required: true
    description: 지역코드 (5자리)
    example: "11110"
  - name: DEAL_YMD
    type: date_yyyymm
    required: true
    description: 거래연월 (YYYYMM 형식)
    example: "202401"

response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values: ["00", "000", 0]

pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000

fields: []

examples:
  - name: seoul_gangnam_2024_01
    description: 서울 강남구 2024년 1월 아파트 매매 실거래가
    params:
      LAWD_CD: "11110"
      DEAL_YMD: "202401"
    page: 1
    page_size: 100
  - name: seoul_gangnam_2024_01_full_page
    description: 서울 강남구 2024년 1월 매매가 (최대 행)
    params:
      LAWD_CD: "11110"
      DEAL_YMD: "202401"
    page: 1
    page_size: 1000

status: active
last_verified: "2026-04-21"
