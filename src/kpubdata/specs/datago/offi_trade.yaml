# catalogue 일괄 변환 생성 (scripts/gen_specs_from_catalogue.py) — 수동 보강 가능
id: datago.offi_trade
provider: datago
title: 오피스텔 매매 실거래자료 (Officetel Trade)
description: MOLIT officetel trade real transaction data

source:
  url: https://www.data.go.kr

endpoint:
  base_url: http://apis.data.go.kr/1613000/RTMSDataSvcOffiTrade
  operation: getRTMSDataSvcOffiTrade
  method: GET
  format_param:
    name: resultType
    values:
      json: json
      xml: xml

auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago

params:
  - name: LAWD_CD
    type: string
    required: true
    description: "지역코드 (5자리)"
    example: "11110"
  - name: DEAL_YMD
    type: date_yyyymm
    required: true
    description: "거래연월 (YYYYMM)"
    example: "202401"

response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values: ["00", "000", 0]

pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000

fields: []

examples:
  - name: seoul_gangnam
    description: 서울 강남구 2024-01
    params:
      LAWD_CD: "11110"
      DEAL_YMD: "202401"
    page: 1
    page_size: 10

status: active
